spring.application.name=backend

spring.datasource.url = jdbc:mysql://localhost:3306/appartel?useSSL=false
spring.datasource.username = root
spring.datasource.password = root

#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto = update

logging.level.root=INFO

logging.level.org.springframework.web = DEBUG
logging.level.com.example.backend = TRACE

jwt.secret=mysecretkey

logging.level.org.springframework.security=DEBUG

# Physical folder where Spring saves images
file.upload-dir=/var/www/images/

# Public URL served by nginx
file.base-url=http://localhost:8080/images/

server.port=${PORT:8080}


